<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>スマホの文字配置を試す｜K-LABO</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#273a32;background:#f6f3ee}
    *{box-sizing:border-box}
    body{margin:0}
    header{background:#fff;border-bottom:1px solid #dedbd4;padding:20px max(18px,calc((100vw - 1080px)/2))}
    .brand{font-size:13px;font-weight:750;letter-spacing:.2em}
    h1{font-size:clamp(22px,3.5vw,31px);font-weight:600;line-height:1.35;letter-spacing:.03em;margin:8px 0 5px}
    .intro{font-size:13px;line-height:1.7;color:#65736b;margin:0}
    main{width:min(1080px,100%);margin:auto;padding:25px 18px 50px;display:grid;grid-template-columns:minmax(300px,430px) minmax(270px,1fr);gap:30px;align-items:start}
    .preview-title{font-size:12px;color:#6c746e;letter-spacing:.12em;margin:0 0 12px}
    .phone{width:min(390px,100%);margin:auto;background:#fff;border:8px solid #222c28;border-radius:31px;box-shadow:0 24px 55px #182b2230;overflow:hidden}
    .phone-bar{height:20px;background:#222c28;position:relative}
    .phone-bar:after{content:"";display:block;position:absolute;width:78px;height:8px;border-radius:10px;background:#515c55;left:calc(50% - 39px);top:6px}
    iframe{display:block;width:100%;height:920px;border:0;background:#fff}
    .panel{background:#fff;border:1px solid #e3ded4;border-radius:20px;padding:23px;box-shadow:0 12px 32px #20372c0d}
    .panel h2{font-size:17px;font-weight:650;margin:0 0 9px}
    .guide{font-size:13px;line-height:1.8;color:#58675e;margin:0 0 17px}
    .parts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
    .part{min-height:42px;border:1px solid #d9ded7;background:#fbfcfa;border-radius:10px;color:#384d40;font-size:12px;text-align:left;padding:8px 10px;cursor:pointer}
    .part.active{border-color:#44715a;background:#e8f0e9;color:#1e4832;font-weight:700}
    .selected{font-size:13px;font-weight:700;margin:0 0 8px}
    .nudge{display:flex;align-items:center;gap:8px;margin-bottom:19px}
    .nudge button,.reset{border:1px solid #d3dbd2;background:#fff;border-radius:9px;min-height:36px;min-width:36px;color:#294c37;font-size:17px;cursor:pointer}
    .coords{font-size:12px;color:#68776c;min-width:64px;text-align:center}
    label{display:block;font-size:13px;font-weight:650;margin-bottom:8px}
    input[type=range]{width:100%;accent-color:#356447}
    .size-line{display:flex;align-items:center;gap:12px;margin:0 0 21px}
    .size-line output{font-size:12px;color:#55685b;min-width:42px;text-align:right}
    .copy{display:block;width:100%;border:0;border-radius:11px;background:#2a523d;color:#fff;font:700 14px inherit;padding:14px 10px;cursor:pointer}
    .link{width:100%;margin-top:10px;padding:10px;border:1px solid #dce3da;border-radius:8px;color:#5b675f;font-size:11px;background:#f8faf7}
    .hint{font-size:12px;line-height:1.6;color:#66746a;margin:9px 0 0}
    .reset{font-size:12px;padding:7px 12px;margin-top:18px}
    .toast{min-height:22px;color:#20603b;font-size:12px;margin-top:10px}
    @media(max-width:760px){main{display:block;padding:19px 13px 40px}.panel{margin-top:24px}.preview-title{text-align:center}}
  </style>
</head>
<body>
  <header><div class="brand">K-LABO · LAYOUT STUDIO</div><h1>スマホの文字配置を試す</h1><p class="intro">写真の上の文字を指やマウスで動かしてください。決まったら共有リンクをコピーして送れます。</p></header>
  <main>
    <section aria-label="スマホ表示のプレビュー"><p class="preview-title">実際のLPをスマホ幅で表示しています</p><div class="phone"><div class="phone-bar"></div><iframe id="preview" src="./?layout-preview=1" title="講座LPのスマホ表示"></iframe></div></section>
    <section class="panel" aria-label="配置の操作"><h2>動かしたい文字を選ぶ</h2><p class="guide">画面上の文字を直接ドラッグできます。細かく動かしたいときは、下の矢印を押してください。</p>
      <div class="parts" id="parts"></div>
      <p class="selected" id="selected">見出し</p>
      <div class="nudge"><button type="button" data-dx="-1" data-dy="0" aria-label="左へ1ピクセル">←</button><button type="button" data-dx="0" data-dy="-1" aria-label="上へ1ピクセル">↑</button><button type="button" data-dx="0" data-dy="1" aria-label="下へ1ピクセル">↓</button><button type="button" data-dx="1" data-dy="0" aria-label="右へ1ピクセル">→</button><span class="coords" id="coords">X 0 / Y 0</span></div>
      <label for="title-size">大見出しの文字サイズ</label><div class="size-line"><input id="title-size" type="range" min="80" max="120" value="100" step="1"><output id="size-value">100%</output></div>
      <button class="copy" id="copy" type="button">この配置の共有リンクをコピー</button><input class="link" id="share-link" type="text" readonly aria-label="共有リンク"><p class="hint">コピーできない場合は、この欄を長押ししてリンクをコピーしてください。リンクを開くと同じ配置を再現できます。</p>
      <button class="reset" id="reset" type="button">配置を元に戻す</button><div class="toast" id="toast" role="status"></div>
    </section>
  </main>
  <script>
  (()=>{
    const names=['英字','短いコピー','大見出し','横線','植物の知識・調合・AI','説明文'];
    const selectors=['.poster-eyebrow','.hero-kicker','.hero h1','.poster-rule','.hero-formula','.hero-lead'];
    const empty=()=>({offsets:names.map(()=>[0,0]),size:100});
    const frame=document.querySelector('#preview');
    const parts=document.querySelector('#parts');
    const link=document.querySelector('#share-link');
    const coords=document.querySelector('#coords');
    const selectedLabel=document.querySelector('#selected');
    const sizeInput=document.querySelector('#title-size');
    const sizeValue=document.querySelector('#size-value');
    const toast=document.querySelector('#toast');
    let state=empty(),selected=2,nodes=[],baseTitleSize=0;
    function parse(value){
      if(!value)return null;
      const n=value.split(',').map(Number);
      if(n.length!==13||n.some(x=>!Number.isFinite(x)))return null;
      return {offsets:names.map((_,i)=>[Math.max(-180,Math.min(180,n[i*2])),Math.max(-350,Math.min(350,n[i*2+1]))]),size:Math.max(80,Math.min(120,n[12]))};
    }
    state=parse(new URLSearchParams(location.search).get('p'))||parse(localStorage.getItem('kalaku-mobile-layout'))||empty();
    function encoded(){return [...state.offsets.flat().map(Math.round),state.size].join(',')}
    function updateLink(){const u=new URL(location.href);u.searchParams.set('p',encoded());link.value=u.href;localStorage.setItem('kalaku-mobile-layout',encoded())}
    function apply(){
      nodes.forEach((node,i)=>{if(node){const [x,y]=state.offsets[i];node.style.transform=`translate3d(${x}px,${y}px,0)`}});
      if(nodes[2])nodes[2].style.fontSize=(baseTitleSize*state.size/100)+'px';
      sizeInput.value=state.size;sizeValue.textContent=state.size+'%';
      coords.textContent=`X ${Math.round(state.offsets[selected][0])} / Y ${Math.round(state.offsets[selected][1])}`;
      updateLink();
    }
    function choose(i){selected=i;selectedLabel.textContent=names[i];parts.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('active',j===i));nodes.forEach((node,j)=>node&&node.classList.toggle('layout-selected',j===i));apply()}
    names.forEach((name,i)=>{const b=document.createElement('button');b.type='button';b.className='part';b.textContent=name;b.addEventListener('click',()=>choose(i));parts.append(b)});
    frame.addEventListener('load',()=>{
      const doc=frame.contentDocument;
      if(!doc){toast.textContent='プレビューを開けませんでした。ページを再読み込みしてください。';return}
      const style=doc.createElement('style');style.textContent='.layout-target{cursor:grab!important;touch-action:none!important;user-select:none!important;position:relative!important;z-index:8!important}.layout-target:hover,.layout-selected{outline:1px dashed #f7d986!important;outline-offset:4px!important}.layout-target:active{cursor:grabbing!important}';doc.head.append(style);
      doc.addEventListener('click',e=>{if(e.target.closest('a,button')){e.preventDefault();e.stopImmediatePropagation()}},true);
      nodes=selectors.map(s=>doc.querySelector(s));
      baseTitleSize=parseFloat(frame.contentWindow.getComputedStyle(nodes[2]).fontSize);
      nodes.forEach((node,i)=>{
        if(!node)return;
        node.classList.add('layout-target');
        node.addEventListener('pointerdown',e=>{
          e.preventDefault();e.stopPropagation();choose(i);
          const start=[e.clientX,e.clientY],origin=[...state.offsets[i]];
          node.setPointerCapture(e.pointerId);
          const move=m=>{state.offsets[i]=[Math.max(-180,Math.min(180,origin[0]+m.clientX-start[0])),Math.max(-350,Math.min(350,origin[1]+m.clientY-start[1]))];apply()};
          const end=()=>{node.removeEventListener('pointermove',move);node.removeEventListener('pointerup',end);node.removeEventListener('pointercancel',end)};
          node.addEventListener('pointermove',move);node.addEventListener('pointerup',end);node.addEventListener('pointercancel',end);
        });
      });
      const hero=doc.querySelector('.hero');
      frame.style.height=Math.ceil(hero.getBoundingClientRect().bottom+12)+'px';
      choose(selected);
    });
    document.querySelectorAll('[data-dx]').forEach(b=>b.addEventListener('click',()=>{state.offsets[selected][0]+=Number(b.dataset.dx);state.offsets[selected][1]+=Number(b.dataset.dy);apply()}));
    sizeInput.addEventListener('input',()=>{state.size=Number(sizeInput.value);apply()});
    document.querySelector('#reset').addEventListener('click',()=>{state=empty();choose(2);toast.textContent='元の配置に戻しました。'});
    document.querySelector('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(link.value);toast.textContent='共有リンクをコピーしました。'}catch{link.focus();link.select();toast.textContent='リンク欄を選択しました。コピーしてください。'}});
    updateLink();
  })();
  </script>
</body>
</html>
